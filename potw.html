<style>
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 6vw 96px; display: flex; flex-direction: column; gap: 40px; }
  .head h1 { font-size: clamp(56px, 8vw, 112px); line-height: 0.9; }
  .head { display: flex; flex-direction: column; gap: 12px; max-width: 720px; }
  .season { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; background: var(--ink); color: var(--ground); border-radius: 24px; padding: 24px 28px; }
  .season .trophy { font-family: var(--display); font-size: 64px; line-height: 0.9; color: var(--orange); }
  .season small { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; color: #A9B6C0; }
  .season b { font-family: var(--display); font-weight: 400; font-size: 36px; text-transform: uppercase; line-height: 1; }
  .season a { color: #C9D3DA; font-size: 14px; }
  .cols { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }
  .board { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .board h2, .picks h2 { font-size: 40px; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--card); }
  .row:hover { box-shadow: 0 6px 18px rgba(11, 13, 16, 0.08); }
  .row:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  .row[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .row[aria-pressed="true"] .rank, .row[aria-pressed="true"] .sub { color: #A9B6C0; }
  .row .rank { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--muted); }
  .row .name { font-weight: 700; font-size: 16px; }
  .row .wins { font-family: var(--display); font-size: 28px; line-height: 1; text-align: right; }
  .row .bar { grid-column: 2 / 4; height: 4px; border-radius: 4px; background: rgba(11, 13, 16, 0.08); overflow: hidden; }
  .row .bar i { display: block; height: 100%; background: var(--orange); }
  .row .sub { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
  .toggle { align-self: flex-start; }
  .picks { flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 8px 0 16px; border-radius: 999px; background: var(--ink); color: var(--ground); font-weight: 600; font-size: 14px; }
  .pill button { all: unset; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.15); }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .pick { display: grid; grid-template-columns: 74px 1fr; gap: 6px 18px; padding: 18px 0; border-top: 1px solid var(--line); }
  .pick .ep { font-family: var(--display); font-size: 40px; line-height: 1; color: var(--orange-text); text-decoration: none; }
  .pick .ep small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--muted); margin-top: 6px; }
  .pick .who { font-family: var(--display); font-size: 30px; line-height: 1; text-transform: uppercase; }
  .pick .who a, .pick .hm a { text-decoration: none; }
  .pick .who a:hover, .pick .hm a:hover { text-decoration: underline; }
  .pick .hm { font-size: 15px; color: var(--body); }
  .pick .from { font-size: 14px; color: var(--muted); }
  .pick .from a { color: var(--muted); }
  @media (max-width: 760px) { .pick { grid-template-columns: 56px 1fr; } .pick .ep { font-size: 32px; } .pick .who { font-size: 24px; } }
</style>
