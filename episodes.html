<style>
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 6vw 96px; display: flex; flex-direction: column; gap: 36px; }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .head h1 { font-size: clamp(56px, 8vw, 112px); line-height: 0.9; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { cursor: pointer; min-height: 44px; padding: 0 18px; border-radius: 999px; font: 600 14px var(--sans); border: 2px solid var(--ink); background: transparent; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 24px; }
  .card { display: flex; flex-direction: column; background: var(--card); border-radius: 20px; overflow: hidden; box-shadow: 0 6px 20px rgba(11, 13, 16, 0.07); text-decoration: none; color: var(--ink); transition: transform 180ms ease, box-shadow 180ms ease; }
  .card:hover { color: var(--ink); transform: translateY(-4px); box-shadow: 0 18px 40px rgba(11, 13, 16, 0.14); }
  .card .art { position: relative; height: 210px; background: #E3EAEF; overflow: hidden; }
  .card .stripe { position: absolute; top: 0; bottom: 0; left: 50%; width: 8px; margin-left: -4px; opacity: 0.25; }
  .card .bignum { position: absolute; left: 18px; top: 4px; font-family: var(--display); font-size: 150px; line-height: 1; color: #CBD5DC; }
  .card .puck { position: absolute; left: 50%; top: 92px; width: 168px; height: 70px; margin-left: -84px; transition: transform 260ms ease; }
  .card:hover .puck { transform: rotate(-8deg) translateY(-4px); }
  .puck i { position: absolute; left: 0; right: 0; display: block; }
  .puck .side { top: 16px; height: 54px; border-radius: 50%; background: #0E0F11; }
  .puck .mid { top: 16px; height: 27px; background: #0E0F11; }
  .puck .face { top: 0; height: 54px; border-radius: 50%; background: #1B1D21; box-shadow: inset 0 0 0 2px #2A2D33; display: flex; align-items: center; justify-content: center; font-style: normal; font-family: var(--display); font-size: 20px; letter-spacing: 0.06em; color: #E9EDF0; }
  .card .kind { position: absolute; right: 14px; top: 14px; padding: 6px 10px; border-radius: 999px; color: #FFFFFF; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; }
  .card .body { padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
  .card .meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
  .card .title { font-family: var(--display); font-size: 28px; line-height: 1; text-transform: uppercase; }
  .card .teaser { font-size: 15px; line-height: 1.5; color: var(--body); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .tag { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: #2A323A; }
  .more { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .count { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); text-align: center; }

  .detail { max-width: 1180px; margin: 0 auto; padding: 8px 6vw 96px; display: flex; flex-direction: column; gap: 40px; }
  .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 600; font-size: 15px; text-decoration: none; }
  .dhead { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between; border-bottom: 3px solid var(--ink); padding-bottom: 32px; }
  .dhead .left { display: flex; flex-direction: column; gap: 14px; max-width: 760px; flex: 999 1 420px; min-width: 0; }
  .dhead h1 { font-size: clamp(48px, 7vw, 96px); line-height: 0.92; }
  .dhead .num { font-family: var(--display); font-size: clamp(120px, 16vw, 220px); line-height: 0.8; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; }
  .stat { background: var(--card); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
  .stat small { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--muted); }
  .stat b { font-size: 19px; line-height: 1.3; }
  .player { background: var(--ink); color: var(--ground); border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 18px; }
  .player .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; }
  .player .label small { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; color: #A9B6C0; }
  .player .label b { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1; text-transform: uppercase; }
  .player audio { width: 100%; }
  .notes { display: flex; flex-wrap: wrap; gap: 40px; }
  .notes .side { flex: 1 1 240px; display: flex; flex-direction: column; gap: 10px; }
  .notes h2 { font-size: 44px; }
  .notes ol { flex: 999 1 480px; min-width: 0; margin: 0; padding: 0; list-style: none; }
  .notes li { display: flex; gap: 20px; align-items: baseline; padding: 18px 0; border-top: 1px solid var(--line); }
  .notes li span { font-family: var(--mono); font-size: 13px; font-weight: 700; min-width: 28px; }
  .notes li p { margin: 0; font-size: 18px; line-height: 1.55; }
  .pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; }
  .pager a { display: flex; flex-direction: column; gap: 4px; text-decoration: none; padding: 8px 0; min-height: 44px; max-width: 46%; }
  .pager a:last-child { align-items: flex-end; text-align: right; }
  .pager small { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--muted); }
  .pager b { font-size: 17px; }
  @media (prefers-reduced-motion: reduce) { .card, .card .puck { transition: none; } .card:hover { transform: none; } }
</style>
